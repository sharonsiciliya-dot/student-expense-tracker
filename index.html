<!DOCTYPE html>
<html>
<head>
    <title>Student Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Student Expense Tracker</h1>
    <p>Manage your daily expenses easily.</p>

    <h2>Total Expenses</h2>
    <h3 id="total">Rs. 0</h3>

    <h2>Add New Expense</h2>

    <input type="text" id="expenseName" placeholder="Enter expense name">

    <input type="number" id="expenseAmount" placeholder="Enter amount">

    <select id="category">
        <option>Food</option>
        <option>Travel</option>
        <option>Education</option>
        <option>Shopping</option>
        <option>Other</option>
    </select>

    <button onclick="addExpense()">Add Expense</button>

    <h2>Expense History</h2>

    <ul id="expenseList"></ul>

    <script src="script.js"></script>

</body>
</html>
